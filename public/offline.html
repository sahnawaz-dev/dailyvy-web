<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a6046" />
    <title>Offline · Dailyvy</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- Shown by the service worker (sw.js) when the app is opened without a connection. -->
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b1214;
        color: #e8efec;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      img { width: 72px; height: 72px; }
      h1 { margin: 6px 0 0; font-size: 20px; }
      p { margin: 0; color: #9fb3ab; line-height: 1.5; font-size: 15px; }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        background: #1a6046;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #217556; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Dailyvy needs a connection to load your day. Your habits and streaks are safe — try again when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Come back by itself as soon as the connection returns
      window.addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
