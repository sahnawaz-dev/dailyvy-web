<!doctype html>
<html lang="en" class="dark" data-color-theme="green">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons + installable app (PWA) — generated from logos/logo.png -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a6046" />
    <meta name="apple-mobile-web-app-title" content="Dailyvy" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Dailyvy</title>
    <meta name="description" content="Grow a little every day: today's tasks, habits with streaks, focus sessions and gentle reminders." />
    <!-- Apply the saved color theme + light/dark mode before the app loads to avoid a flash.
         Mirrors src/shared/theme/themeStore.ts (defaults: Green, Dark — also set on <html> above). -->
    <script>
      try {
        var saved = (JSON.parse(localStorage.getItem('habit-tracker:theme')) || {}).state || {}
        if (saved.colorTheme) document.documentElement.dataset.colorTheme = saved.colorTheme
        var mode = saved.mode || 'dark'
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
